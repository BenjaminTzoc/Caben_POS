<div class="py-4 px-0 md:px-6 min-h-screen transition-colors duration-200"
     [ngClass]="themeService.isDarkMode() ? 'bg-[#0D1117]' : 'bg-slate-50/50'">
  <!-- Header Section -->
  <app-page-header
    [title]="isEditMode ? 'Editar Categoría' : 'Nueva Categoría'"
    subtitle="Completa la información para configurar una categoría de productos en el catálogo."
    icon="pi pi-tags"
    colorScheme="burgundy"
    [showBackButton]="true"
    (onBack)="onCancelProccess()"
  >
    <ng-container actions>
      <app-secondary-button
        label="Cancelar"
        icon="pi pi-times"
        colorScheme="burgundy"
        (clicked)="onCancelProccess()"
      />
      <app-primary-button
        [label]="isEditMode ? 'Guardar Cambios' : 'Crear Categoría'"
        [icon]="isEditMode ? 'pi pi-save' : 'pi pi-check'"
        [disabled]="categoryForm.invalid"
        (clicked)="onSaveCategory()"
      />
    </ng-container>
  </app-page-header>

  <form class="max-w-[900px] mx-auto pb-32 px-4 md:px-0" [formGroup]="categoryForm">
    <div class="rounded-2xl border shadow-sm p-6 md:p-8 flex flex-col gap-6 transition-colors"
         [ngClass]="themeService.isDarkMode() ? 'bg-[#161B22] border-[#30363D]' : 'bg-white border-slate-200'">
      
      <!-- Name Field -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold"
               [ngClass]="themeService.isDarkMode() ? 'text-[#F0F6FC]' : 'text-[#48021C]'" for="name">
          Nombre de la Categoría <span class="text-rose-500">*</span>
        </label>
        <input
          pInputText
          id="name"
          formControlName="name"
          class="w-full !rounded-xl h-10 text-xs font-medium"
          [ngClass]="[
            themeService.isDarkMode()
              ? '!bg-[#0D1117] !border-[#30363D] !text-[#F0F6FC] focus:!border-[#58A6FF]'
              : '!bg-white !border-slate-300 !text-slate-800 focus:!border-[#48021C]',
            categoryForm.get('name')?.invalid && categoryForm.get('name')?.touched ? '!border-rose-400 ng-invalid ng-dirty' : ''
          ]"
          placeholder="Ej. Cortes de Res, Embutidos, Lácteos..."
          autocomplete="off"
        />
        @if (categoryForm.get('name')?.invalid && categoryForm.get('name')?.touched) {
          <small class="text-rose-500 text-[10px] font-medium flex items-center mt-0.5">
            <i class="pi pi-exclamation-circle mr-1 text-[10px]"></i>Ingrese el nombre de la categoría.
          </small>
        }
      </div>

      <!-- Default Unit -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold"
               [ngClass]="themeService.isDarkMode() ? 'text-[#F0F6FC]' : 'text-[#48021C]'" for="defaultUnitId">
          Unidad de Medida por Defecto (Opcional)
        </label>
        <p-select
          [options]="units"
          [checkmark]="true"
          [showClear]="true"
          formControlName="defaultUnitId"
          optionLabel="name"
          optionValue="id"
          placeholder="Seleccionar unidad (Kg, Unidad, Lts...)"
          styleClass="w-full !rounded-xl text-xs font-medium"
          fluid
        />
        <div class="flex items-start gap-2 text-[11px] font-medium leading-snug mt-1"
             [ngClass]="themeService.isDarkMode() ? 'text-[#58A6FF]' : 'text-[#48021C]'">
          <i class="pi pi-info-circle mt-0.5 text-xs"></i>
          <span>La unidad seleccionada se sugerirá automáticamente al crear productos bajo esta categoría.</span>
        </div>
      </div>

      <!-- Description -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold"
               [ngClass]="themeService.isDarkMode() ? 'text-[#F0F6FC]' : 'text-[#48021C]'" for="description">
          Descripción (Opcional)
        </label>
        <textarea
          rows="4"
          pTextarea
          id="description"
          formControlName="description"
          class="w-full !rounded-xl p-3 text-xs font-medium resize-none transition-colors"
          [ngClass]="[
            themeService.isDarkMode()
              ? '!bg-[#0D1117] !border-[#30363D] !text-[#F0F6FC] focus:!border-[#58A6FF]'
              : '!bg-white !border-slate-300 !text-slate-800 focus:!border-[#48021C]'
          ]"
          placeholder="Breve descripción del grupo de productos..."
          autocomplete="off"
        ></textarea>
      </div>

      <!-- Botones de Acción al pie del formulario en móvil -->
      <div class="flex items-center justify-end gap-3 pt-4 border-t"
           [ngClass]="themeService.isDarkMode() ? 'border-[#30363D]' : 'border-slate-100'">
        <app-secondary-button
          label="Cancelar"
          icon="pi pi-times"
          colorScheme="burgundy"
          (clicked)="onCancelProccess()"
        />
        <app-primary-button
          [label]="isEditMode ? 'Guardar Cambios' : 'Crear Categoría'"
          [icon]="isEditMode ? 'pi pi-save' : 'pi pi-check'"
          [disabled]="categoryForm.invalid"
          (clicked)="onSaveCategory()"
        />
      </div>

    </div>
  </form>
</div>

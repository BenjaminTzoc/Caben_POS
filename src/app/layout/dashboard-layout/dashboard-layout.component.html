<div class="fixed inset-0 flex overflow-visible transition-colors duration-300"
  [ngClass]="themeService.isDarkMode() ? 'bg-[#0D1117]' : 'bg-[#F1F3F4]'">
  <app-modern-sidebar 
    [collapsed]="isSidebarCollapsed" 
    (toggle)="onToggleSidebar($event)"
    class="flex-shrink-0 h-full" 
  />

  <div class="flex-1 flex flex-col h-full min-w-0 overflow-hidden relative">
    @if (navigating()) {
      <div class="nav-progress" aria-hidden="true"></div>
    }

    <app-header 
      [sidebarCollapsed]="isSidebarCollapsed"
      class="flex-shrink-0 z-20">
    </app-header>

    <main class="flex-1 overflow-y-auto overflow-x-hidden relative z-10 transition-colors duration-300"
      [ngClass]="themeService.isDarkMode() ? 'bg-[#0D1117]' : 'bg-[#F1F3F4]'">
      <div class="max-w-[1600px] mx-auto min-h-full">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>

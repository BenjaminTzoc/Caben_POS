<div class="flex flex-col gap-1 w-full" [ngClass]="widthClass">
  <div class="relative flex items-center w-full">
    <p-select [options]="sortedBranches" [ngModel]="value" (ngModelChange)="onModelChange($event)" optionLabel="name"
      optionValue="id" [showClear]="showClear && !!value" [placeholder]="placeholder" [disabled]="disabled"
      [size]="size" appendTo="body" class="shadow-2xs w-full group"
      [styleClass]="(size === 'small' ? '!rounded-lg h-8! text-xs' : '!rounded-xl h-9! text-xs') + ' ' + (disabled 
        ? (themeService.isDarkMode() ? '!bg-[#161B22]/70 !border-[#30363D] !text-slate-500 !cursor-not-allowed opacity-75 grayscale-30 shadow-none' : '!bg-slate-100/90 !border-slate-300/80 !text-slate-400 !cursor-not-allowed opacity-75 grayscale-30 shadow-none') 
        : (themeService.isDarkMode() 
            ? '!bg-[#161B22] !border-[#30363D] hover:!border-[#58A6FF]/60 hover:!bg-[#1C2128] focus:!border-[#58A6FF] focus:!ring-2 focus:!ring-[#58A6FF]/20 !text-[#F0F6FC]' 
            : '!bg-rose-50/40 !border-[#48021C]/25 hover:!border-[#48021C]/60 hover:!bg-white focus:!border-[#48021C] focus:!ring-2 focus:!ring-[#48021C]/10 !text-[#48021C]')) + ' w-full transition-all duration-200'"
      [panelStyleClass]="themeService.isDarkMode() ? '!bg-[#161B22] !border-[#30363D] !text-slate-200 shadow-2xl' : '!bg-white !border-slate-200 shadow-xl'">
      <!-- Plantilla de Valor Seleccionado con Icono y Truncado -->
      <ng-template #selectedItem let-selectedOption>
        @if (selectedOption) {
        <div class="flex items-center gap-2 text-sm font-medium min-w-0 w-full" [ngClass]="disabled 
              ? (themeService.isDarkMode() ? 'text-slate-500' : 'text-slate-400') 
              : (themeService.isDarkMode() ? 'text-[#F0F6FC]' : 'text-slate-800')">
          <span class="w-5.5 h-5.5 rounded-md flex items-center justify-center shrink-0 border"
            [ngClass]="disabled 
                ? (themeService.isDarkMode() ? 'bg-slate-800 text-slate-500 border-slate-700' : 'bg-slate-200/80 text-slate-500 border-slate-300') 
                : (selectedOption.isPlant 
                    ? (themeService.isDarkMode() ? 'bg-emerald-950/50 text-emerald-400 border-emerald-800/60' : 'bg-emerald-50 text-emerald-700 border-emerald-200') 
                    : (themeService.isDarkMode() ? 'bg-[#1C2D42] text-[#58A6FF] border-[#58A6FF]/30' : 'bg-sky-50 text-sky-700 border-sky-200'))">
            <i [class]="selectedOption.isPlant ? 'pi pi-server' : 'pi pi-shop'" class="text-xs"></i>
          </span>
          <span class="truncate flex-1 font-medium text-sm">{{ selectedOption.name }}</span>
        </div>
        } @else {
        <div class="flex items-center gap-2 text-sm font-medium min-w-0 w-full" [ngClass]="disabled 
              ? (themeService.isDarkMode() ? '!text-slate-500' : '!text-slate-400') 
              : (themeService.isDarkMode() ? '!text-[#F0F6FC]' : '!text-slate-700')">
          <span class="w-5.5 h-5.5 rounded-md flex items-center justify-center shrink-0 border"
            [ngClass]="disabled 
                ? (themeService.isDarkMode() ? 'bg-slate-800 text-slate-600 border-slate-700' : 'bg-slate-200/60 text-slate-400 border-slate-300') 
                : (themeService.isDarkMode() ? 'bg-[#800F38]/35 text-[#FFA8C8] border-[#A81D4C]/50 shadow-xs' : 'bg-[#48021C]/10 text-[#48021C] border-[#48021C]/20')">
            <i class="pi pi-globe text-xs"></i>
          </span>
          <span class="truncate flex-1 font-medium text-sm"
            [ngClass]="themeService.isDarkMode() ? '!text-[#F0F6FC]' : '!text-slate-700'">{{ placeholder }}</span>
        </div>
        }
      </ng-template>

      <!-- Plantilla de Opciones del Dropdown con Badge de Planta -->
      <ng-template #item let-branch>
        <div class="flex items-center justify-between gap-2 py-1 text-sm">
          <div class="flex items-center gap-2.5 min-w-0">
            <span class="w-6 h-6 rounded-md flex items-center justify-center shrink-0 border" 
              [ngClass]="branch.isPlant 
                ? (themeService.isDarkMode() ? 'bg-emerald-950/50 text-emerald-400 border-emerald-800/60' : 'bg-emerald-50 text-emerald-700 border-emerald-200') 
                : (themeService.isDarkMode() ? 'bg-[#1C2D42] text-[#58A6FF] border-[#30363D]' : 'bg-sky-50 text-sky-700 border-sky-200')">
              <i [class]="branch.isPlant ? 'pi pi-server' : 'pi pi-shop'" class="text-xs"></i>
            </span>
            <span class="font-medium truncate"
              [ngClass]="themeService.isDarkMode() ? 'text-slate-200' : 'text-slate-800'">{{ branch.name }}</span>
          </div>
          @if (branch.isPlant) {
          <span class="px-1.5 py-0.5 text-[10px] font-bold uppercase rounded border" [ngClass]="themeService.isDarkMode() 
                ? 'bg-emerald-950/60 text-emerald-300 border-emerald-800/60' 
                : 'bg-emerald-50 text-emerald-700 border-emerald-200'">
            Planta
          </span>
          }
        </div>
      </ng-template>
    </p-select>
  </div>
</div>

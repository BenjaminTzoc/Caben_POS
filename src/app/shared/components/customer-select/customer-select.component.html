<div class="flex flex-col gap-1 w-full" [ngClass]="widthClass">
  <div class="relative flex items-center w-full">
    <p-select
      [options]="customers"
      [ngModel]="value"
      (ngModelChange)="onModelChange($event)"
      optionLabel="name"
      optionValue="id"
      [filter]="true"
      filterBy="name,nit"
      [showClear]="showClear && !disabled && !!value"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [size]="size"
      appendTo="body"
      class="shadow-2xs w-full group"
      [styleClass]="(size === 'small' ? '!rounded-lg h-8! text-xs' : '!rounded-xl h-9! text-xs') + ' ' + (disabled 
        ? (themeService.isDarkMode() ? '!bg-[#161B22]/70 !border-[#30363D] !text-slate-500 !cursor-not-allowed opacity-75 grayscale-30 shadow-none' : '!bg-slate-100/90 !border-slate-300/80 !text-slate-400 !cursor-not-allowed opacity-75 grayscale-30 shadow-none') 
        : (themeService.isDarkMode() 
            ? '!bg-[#161B22] !border-[#30363D] hover:!border-[#58A6FF]/60 hover:!bg-[#1C2128] focus:!border-[#58A6FF] focus:!ring-2 focus:!ring-[#58A6FF]/20 !text-[#F0F6FC]' 
            : '!bg-rose-50/40 !border-[#48021C]/25 hover:!border-[#48021C]/60 hover:!bg-white focus:!border-[#48021C] focus:!ring-2 focus:!ring-[#48021C]/10 !text-[#48021C]')) + ' w-full transition-all duration-200'"
      [panelStyleClass]="themeService.isDarkMode() ? '!bg-[#161B22] !border-[#30363D] !text-slate-200 shadow-2xl' : '!bg-white !border-slate-200 shadow-xl'"
    >
      <!-- Plantilla de Valor Seleccionado -->
      <ng-template #selectedItem let-selectedOption>
        @if (selectedOption) {
          <div class="flex items-center gap-2 text-xs font-semibold min-w-0 w-full" 
               [ngClass]="disabled 
                 ? (themeService.isDarkMode() ? 'text-slate-500' : 'text-slate-400') 
                 : (themeService.isDarkMode() ? 'text-[#F0F6FC]' : 'text-slate-800')">
            <span class="truncate flex-1">{{ selectedOption.name }}</span>
          </div>
        } @else {
          <div class="flex items-center gap-2 text-xs min-w-0 w-full"
               [ngClass]="disabled 
                 ? (themeService.isDarkMode() ? '!text-slate-500' : '!text-slate-400') 
                 : (themeService.isDarkMode() ? '!text-[#8B949E]' : '!text-slate-400')">
            <span class="truncate flex-1 italic">{{ placeholder }}</span>
          </div>
        }
      </ng-template>

      <!-- Plantilla de Opciones en Dropdown -->
      <ng-template #item let-customer>
        <div class="flex items-center justify-between gap-2 py-1 text-xs w-full">
          <div class="flex flex-col min-w-0">
            <span class="font-semibold truncate text-xs"
                  [ngClass]="themeService.isDarkMode() ? 'text-[#F0F6FC]' : 'text-slate-800'">{{ customer.name }}</span>
            <span *ngIf="customer.nit" class="text-[10px]"
                  [ngClass]="themeService.isDarkMode() ? 'text-[#8B949E]' : 'text-slate-400'">NIT: {{ customer.nit }}</span>
          </div>
          <span *ngIf="customer.phone" class="text-[10px] font-medium shrink-0"
                [ngClass]="themeService.isDarkMode() ? 'text-[#8B949E]' : 'text-slate-400'">
            {{ customer.phone }}
          </span>
        </div>
      </ng-template>
    </p-select>
  </div>
</div>

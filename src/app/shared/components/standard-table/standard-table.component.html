<div
  [class]="'rounded-xl border overflow-hidden shadow-xs flex flex-col flex-1 ' + containerClass + ' ' + customClass"
  [style.--table-content-height]="scrollHeight"
>
  <p-table
    #dataTable
    [value]="value"
    [loading]="loading"
    [paginator]="paginator"
    [rows]="rows"
    [first]="first"
    [totalRecords]="totalRecords"
    [lazy]="lazy"
    (onLazyLoad)="onLazyLoad.emit($event)"
    (onRowExpand)="onRowExpand.emit($event)"
    (onRowCollapse)="onRowCollapse.emit($event)"
    [rowsPerPageOptions]="showRowsPerPageDropdown && rowsPerPageOptions && rowsPerPageOptions.length ? rowsPerPageOptions : undefined"
    [paginatorDropdownAppendTo]="'body'"
    [globalFilterFields]="globalFilterFields"
    [dataKey]="dataKey"
    [scrollable]="scrollable"
    [scrollHeight]="scrollHeight"
    styleClass="p-datatable-striped p-datatable-sm rounded-xl flex-1 overflow-hidden"
  >
    <!-- Header Template -->
    <ng-template pTemplate="header">
      <ng-container *ngTemplateOutlet="headerTemplate"></ng-container>
    </ng-template>

    <!-- Body Template -->
    <ng-template pTemplate="body" let-item let-expanded="expanded" let-rowIndex="rowIndex">
      <ng-container
        *ngTemplateOutlet="bodyTemplate; context: { $implicit: item, expanded: expanded, rowIndex: rowIndex }"
      ></ng-container>
    </ng-template>

    <!-- Expanded Row Template -->
    @if (expandedRowTemplate) {
      <ng-template pTemplate="rowexpansion" let-item>
        <ng-container *ngTemplateOutlet="expandedRowTemplate; context: { $implicit: item }"></ng-container>
      </ng-template>
      <ng-template pTemplate="expandedrow" let-item>
        <ng-container *ngTemplateOutlet="expandedRowTemplate; context: { $implicit: item }"></ng-container>
      </ng-template>
    }

    <!-- Footer Template (optional) -->
    @if (footerTemplate) {
      <ng-template pTemplate="footer">
        <ng-container *ngTemplateOutlet="footerTemplate"></ng-container>
      </ng-template>
    }

    <!-- Empty Message Template -->
    <ng-template pTemplate="emptymessage">
      @if (emptyMessageTemplate) {
        <ng-container *ngTemplateOutlet="emptyMessageTemplate"></ng-container>
      } @else {
        <tr>
          <td colspan="100" class="text-center !py-12 !px-4 bg-transparent border-0">
            <div class="flex flex-col items-center justify-center max-w-sm mx-auto select-none gap-2">
              <!-- Icon directly without box/card -->
              <i 
                [class]="emptyIcon + ' !text-4xl transition-colors'"
                [ngClass]="themeService.isDarkMode() ? 'text-[#58A6FF]/80' : 'text-slate-400'"
              ></i>

              <!-- Primary Title -->
              <h4 
                class="text-sm font-semibold tracking-tight m-0 transition-colors"
                [ngClass]="themeService.isDarkMode() ? 'text-[#F0F6FC]' : 'text-slate-700'"
              >
                Sin registros disponibles
              </h4>

              <!-- Descriptive Message -->
              <p 
                class="text-xs font-normal leading-relaxed text-center m-0 max-w-xs transition-colors" 
                [ngClass]="themeService.isDarkMode() ? 'text-[#8B949E]' : 'text-slate-500'"
              >
                {{ emptyMessage }}
              </p>
            </div>
          </td>
        </tr>
      }
    </ng-template>
  </p-table>
</div>

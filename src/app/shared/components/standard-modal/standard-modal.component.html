<p-dialog
  [(visible)]="visible"
  (visibleChange)="visibleChange.emit($event)"
  (onHide)="onHide()"
  [modal]="true"
  [dismissableMask]="dismissableMask"
  [closeOnEscape]="closeOnEscape"
  [showHeader]="false"
  [closable]="true"
  [style]="{ width: 'min(' + width + ', ' + maxWidth + ')', maxWidth: maxWidth, maxHeight: maxHeight }"
  contentStyleClass="!p-0 !overflow-hidden flex flex-col max-h-[90vh] w-full"
  appendTo="body"
  [styleClass]="'!rounded-2xl !overflow-hidden shadow-2xl !w-full ' + (themeService.isDarkMode() ? '!bg-[#161B22] !border-2 !border-[#30363D]' : '!bg-white !border-2 !border-[#48021C]/25')"
>
  <div class="p-0 flex flex-col h-full w-full overflow-hidden transition-colors" [ngClass]="themeService.isDarkMode() ? 'bg-[#161B22]' : 'bg-white'">
    <!-- Modal Standard Header -->
    <div 
      class="flex flex-col sm:flex-row justify-between sm:items-center py-2.5 px-4 md:px-6 border-b rounded-t-2xl gap-3 flex-shrink-0 transition-colors"
      [ngClass]="themeService.isDarkMode() ? 'bg-[#161B22] border-[#30363D]' : 'bg-rose-50/60 border-[#48021C]/15'"
    >
      <!-- Left side: Close Button, Title & Badge -->
      <div class="flex items-center gap-2.5">
        <button 
          type="button" 
          (click)="close()" 
          class="w-8 h-8 rounded-lg flex items-center justify-center shadow-xs transition-all active:scale-95 cursor-pointer border"
          [ngClass]="themeService.isDarkMode() ? 'bg-[#1C2128] hover:bg-[#30363D] text-[#F0F6FC] border-[#30363D]' : 'bg-[#48021C]/10 hover:bg-[#48021C]/20 text-[#48021C] border-[#48021C]/20 hover:border-[#48021C]/40'"
          title="Cerrar"
        >
          <i class="pi pi-times text-xs font-semibold"></i>
        </button>

        <div class="flex items-center gap-2">
          <h1 
            class="text-base md:text-lg font-semibold tracking-tight leading-none m-0 transition-colors"
            [ngClass]="themeService.isDarkMode() ? 'text-[#F0F6FC]' : 'text-gray-900'"
          >
            {{ title }}
          </h1>
          @if (badge) {
            <span 
              class="text-[11px] font-bold px-2 py-0.5 rounded-md border"
              [ngClass]="themeService.isDarkMode() ? 'bg-[#1C2D42] text-[#58A6FF] border-[#58A6FF]/30' : 'bg-[#48021C]/10 text-[#48021C] border-[#48021C]/20'"
            >
              {{ badge }}
            </span>
          }
        </div>
      </div>

      <!-- Right side: Actions Slot -->
      <div class="flex items-center gap-2 w-full sm:w-auto flex-wrap sm:flex-nowrap">
        <ng-content select="[actions]"></ng-content>
      </div>
    </div>

    <!-- Body Content Slot -->
    <div 
      class="p-4 md:p-6 flex-1 flex flex-col min-h-0 overflow-hidden transition-colors"
      [ngClass]="themeService.isDarkMode() ? 'bg-[#161B22]' : 'bg-white'"
    >
      <ng-content></ng-content>
    </div>

    <!-- Footer Slot -->
    <div 
      class="empty:hidden flex items-center justify-end gap-2 flex-wrap py-3 px-4 md:px-6 border-t flex-shrink-0 transition-colors"
      [ngClass]="themeService.isDarkMode() ? 'bg-[#161B22] border-[#30363D]' : 'bg-rose-50/40 border-[#48021C]/15'"
    >
      <ng-content select="[footer]"></ng-content>
    </div>
  </div>
</p-dialog>
